# pip install -e ".[dev]"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bib-ami"
dynamic = ["version"]
description = "A command-line client for bib-ami citation verification"
readme = "README.md"
authors = [{name = "Carlson Research, LLC"}]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/carlson-research/bib-ami-client"
Repository = "https://github.com/carlson-research/bib-ami-client"
Documentation = "https://carlson-research.github.io/bib-ami-client/"

[project.scripts]
bib-ami = "bib_ami.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.30.0",
    "sphinx>=7.0.0",
    "sphinx_rtd_theme>=2.0.0",
    "pre-commit<3.8.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.coverage.run]
source = ["src/bib_ami"]
omit = [
    "src/bib_ami/__main__.py",
]

[tool.setuptools.dynamic]
version = {attr = "bib_ami._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bib_ami*"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
pythonpath = [".", "src"]
testpaths = ["tests", "src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if self.verbose:"
]
show_missing = true
