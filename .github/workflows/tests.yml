name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock pytest-httpx build mypy pre-commit
          pip install -e .

      - name: Run Linters & Type Checks
        run: |
          pre-commit run --all-files
          mypy src/

      - name: Run Unit Tests
        run: |
          pytest tests/unit/ -v --cov=bib_ami --cov-report=xml

      - name: Run E2E Tests
        run: |
          pytest tests/e2e/ -v --log-file=integration.log
